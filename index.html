<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zona Fichas Rápidas</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --success-hover: #15803d;
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-body);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: #38bdf8;
        }

        .upload-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            border: none;
            padding: 14px 10px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            color: white;
        }

        .btn-camera { background-color: var(--success); }
        .btn-camera:hover { background-color: var(--success-hover); }

        .btn-gallery { background-color: var(--primary); }
        .btn-gallery:hover { background-color: var(--primary-hover); }

        #preview-container {
            display: none;
            margin-bottom: 20px;
            text-align: center;
        }

        #preview-img {
            max-width: 100%;
            max-height: 220px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            object-fit: contain;
        }

        .status {
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 16px;
            min-height: 20px;
            color: #fbbf24;
        }

        .output-box {
            background-color: var(--bg-body);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 15px;
        }

        .output-box h2 {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .detected-tag {
            color: #38bdf8;
            font-weight: bold;
        }

        pre {
            white-space: pre-wrap;
            word-break: break-word;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            color: #e2e8f0;
            max-height: 200px;
            overflow-y: auto;
        }

        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Cabeçalho -->
        <div class="header">
            <h1>Zona Fichas Rápidas</h1>
            <p>Digitalizador e leitor automático de bilhetes manuais</p>
        </div>

        <!-- Seleção da Liga -->
        <div class="form-group">
            <label for="leagueSelect">Selecionar Liga / Competição</label>
            <select id="leagueSelect">
                <option value="geral">Geral / Todas as Ligas</option>
                <option value="angola">Girabola (Angola)</option>
                <option value="premier">Premier League (Inglaterra)</option>
                <option value="laliga">La Liga (Espanha)</option>
                <option value="seriea">Serie A (Itália)</option>
                <option value="ligaportugal">Liga Portugal</option>
                <option value="champions">UEFA Champions League</option>
            </select>
        </div>

        <!-- Botões de Envio -->
        <div class="upload-buttons">
            <button class="btn btn-camera" onclick="document.getElementById('camInput').click()">
                📷 Câmara
            </button>
            <button class="btn btn-gallery" onclick="document.getElementById('galInput').click()">
                📁 Galeria
            </button>
        </div>

        <input type="file" id="camInput" accept="image/*" capture="environment" onchange="processarFicha(event)">
        <input type="file" id="galInput" accept="image/*" onchange="processarFicha(event)">

        <!-- Pré-visualização da Ficha -->
        <div id="preview-container">
            <img id="preview-img" src="" alt="Ficha de Aposta">
        </div>

        <!-- Mensagem de Estado -->
        <div id="status" class="status"></div>

        <!-- Apostas Identificadas (Padrão Aposta - Prognóstico) -->
        <div class="output-box">
            <h2>Apostas Identificadas (Aposta - Prognóstico):</h2>
            <pre id="parsedOutput">Nenhuma aposta processada ainda.</pre>
        </div>

        <!-- Texto Completo/Bruto do OCR -->
        <div class="output-box">
            <h2>Leitura Completa (Texto Bruto):</h2>
            <pre id="rawOutput">Nenhuma ficha enviada no momento.</pre>
        </div>
    </div>

    <script>
        // 🔑 Tua Chave Google Cloud Vision API
        const GOOGLE_VISION_API_KEY = 'AIzaSyBDS05EdjeiG4ht4Y5GO9NHUpZR16mrvWc';

        async function processarFicha(event) {
            const file = event.target.files[0];
            if (!file) return;

            const previewImg = document.getElementById('preview-img');
            const previewContainer = document.getElementById('preview-container');
            const statusDiv = document.getElementById('status');
            const parsedPre = document.getElementById('parsedOutput');
            const rawPre = document.getElementById('rawOutput');
            const ligaSelecionada = document.getElementById('leagueSelect').value;

            // Exibe a pré-visualização da imagem
            previewImg.src = URL.createObjectURL(file);
            previewContainer.style.display = 'block';

            statusDiv.style.color = '#fbbf24';
            statusDiv.innerText = "⏳ A ler dados da ficha manual...";
            parsedPre.innerText = "A filtrar jogos...";
            rawPre.innerText = "A ligar ao servidor...";

            try {
                const base64Clean = await convertToBase64(file);

                const response = await fetch(`https://vision.googleapis.com/v1/images:annotate?key=${GOOGLE_VISION_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        requests: [{
                            image: { content: base64Clean },
                            features: [{ type: 'TEXT_DETECTION' }]
                        }]
                    })
                });

                const data = await response.json();

                if (data.responses && data.responses[0].fullTextAnnotation) {
                    const textoExtraido = data.responses[0].fullTextAnnotation.text;
                    statusDiv.style.color = '#4ade80';
                    statusDiv.innerText = "✅ Ficha lida com sucesso!";
                    
                    // Exibe o texto bruto lido
                    rawPre.innerText = textoExtraido;

                    // Filtra as apostas no padrão: Aposta - Prognóstico
                    extrairApostasManual(textoExtraido, ligaSelecionada);
                } else {
                    statusDiv.style.color = '#f87171';
                    statusDiv.innerText = "⚠️ Não foi possível ler o texto da imagem.";
                    parsedPre.innerText = "Nenhuma aposta identificada.";
                    rawPre.innerText = "Tenta tirar uma foto mais focada e com boa iluminação.";
                }

            } catch (error) {
                console.error("Erro na API:", error);
                statusDiv.style.color = '#f87171';
                statusDiv.innerText = "❌ Ocorreu um erro ao processar a imagem.";
                parsedPre.innerText = "Erro ao processar.";
                rawPre.innerText = error.message;
            }
        }

        // Função para extrair linhas no formato "Aposta - Prognóstico"
        function extrairApostasManual(texto, liga) {
            const parsedPre = document.getElementById('parsedOutput');
            const linhas = texto.split('\n');

            // Regex flexível para apanhar formatos como: "101 - 1", "205-X", "12 - 2.5", "10 - 1X"
            // Suporta travessões normais (-), hífens ou meia-risca (–, —) e espaços opcionais
            const regexTravessao = /\b([0-9A-Za-z]+)\s*[-–—]\s*([0-9A-Za-z.,]+)\b/g;

            let apostasEncontradas = [];

            linhas.forEach((linha) => {
                let match;
                while ((match = regexTravessao.exec(linha)) !== null) {
                    const aposta = match[1].trim();
                    const prognostico = match[2].trim();
                    apostasEncontradas.push(`Aposta: ${aposta}  |  Prognóstico: ${prognostico}`);
                }
            });

            if (apostasEncontradas.length > 0) {
                let resultadoFinal = `[LIGA: ${liga.toUpperCase()}]\n`;
                resultadoFinal += `[TOTAL DE JOGOS IDENTIFICADOS: ${apostasEncontradas.length}]\n\n`;
                resultadoFinal += apostasEncontradas.join('\n');
                
                parsedPre.innerText = resultadoFinal;
            } else {
                parsedPre.innerText = `[LIGA: ${liga.toUpperCase()}]\n\n⚠️ Nenhuma linha no formato "Aposta - Prognóstico" foi reconhecida.\nVerifique se os números e o travessão (-) estão bem visíveis na foto.`;
            }
        }

        function convertToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
