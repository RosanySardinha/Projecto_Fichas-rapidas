<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zona Fichas Rápidas</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 20px; 
            text-align: center; 
            background-color: #f4f4f9;
            color: #333;
        }
        .btn-group {
            margin: 15px 0;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .btn { 
            padding: 12px 20px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            font-size: 16px; 
            cursor: pointer; 
        }
        .btn-cam {
            background: #28a745;
        }
        select {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
            width: 100%;
            max-width: 300px;
        }
        #resultado, #resultado-bruto { 
            margin-top: 15px; 
            text-align: left; 
            background: #ffffff; 
            padding: 15px; 
            border-radius: 5px; 
            white-space: pre-wrap; 
            font-family: monospace; 
            border: 1px solid #ddd;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        #status { 
            font-weight: bold; 
            color: #555; 
            margin-top: 10px; 
        }
        #preview-img {
            max-width: 100%;
            max-height: 200px;
            margin-top: 10px;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>
<body>

    <h2>Zona Fichas Rápidas</h2>
    <p>Carrega a foto da ficha manual para extrair os dados:</p>

    <div>
        <select id="leagueSelect">
            <option value="geral">Geral / Todas as Ligas</option>
            <option value="angola">Girabola (Angola)</option>
            <option value="premier">Premier League (Inglaterra)</option>
            <option value="laliga">La Liga (Espanha)</option>
            <option value="seriea">Serie A (Itália)</option>
            <option value="ligaportugal">Liga Portugal</option>
            <option value="champions">UEFA Champions League</option>
        </select>
    </div>

    <div class="btn-group">
        <button class="btn btn-cam" onclick="document.getElementById('cameraInput').click()">📷 Tirar Foto</button>
        <button class="btn" onclick="document.getElementById('galleryInput').click()">📁 Galeria</button>
    </div>

    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;" onchange="processarFicha(event)">
    <input type="file" id="galleryInput" accept="image/*" style="display: none;" onchange="processarFicha(event)">
    
    <center><img id="preview-img" src="" alt="Ficha"></center>

    <div id="status"></div>

    <h3>Apostas Filtradas (Aposta - Prognóstico):</h3>
    <div id="resultado">Aguardando imagem...</div>

    <h3>Texto Bruto Extraído:</h3>
    <div id="resultado-bruto">Aguardando imagem...</div>

    <script>
        // 🔑 Tua Chave de API do Google Cloud Vision
        const GOOGLE_VISION_API_KEY = 'AIzaSyBDS05EdjeiG4ht4Y5GO9NHUpZR16mrvWc';

        async function processarFicha(event) {
            const file = event.target.files[0];
            if (!file) return;

            const statusDiv = document.getElementById('status');
            const resultadoDiv = document.getElementById('resultado');
            const brutoDiv = document.getElementById('resultado-bruto');
            const previewImg = document.getElementById('preview-img');
            const liga = document.getElementById('leagueSelect').value;

            previewImg.src = URL.createObjectURL(file);
            previewImg.style.display = 'block';

            statusDiv.innerText = "⏳ A processar imagem e a ler dados...";
            resultadoDiv.innerText = "A filtrar apostas...";
            brutoDiv.innerText = "A ler imagem...";

            try {
                const base64Image = await convertToBase64(file);

                const response = await fetch(`https://vision.googleapis.com/v1/images:annotate?key=${GOOGLE_VISION_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        requests: [{
                            image: { content: base64Image },
                            features: [{ type: 'TEXT_DETECTION' }]
                        }]
                    })
                });

                const data = await response.json();

                if (data.responses && data.responses[0].fullTextAnnotation) {
                    const textoCompleto = data.responses[0].fullTextAnnotation.text;
                    statusDiv.innerText = "✅ Leitura concluída com sucesso!";
                    brutoDiv.innerText = textoCompleto;

                    // Filtra o padrão Aposta - Prognóstico
                    extrairApostas(textoCompleto, liga);

                } else if (data.responses && data.responses[0].error) {
                    statusDiv.innerText = "❌ Erro da API: " + data.responses[0].error.message;
                } else {
                    statusDiv.innerText = "⚠️ Nenhum texto foi encontrado na imagem.";
                }

            } catch (error) {
                console.error("Erro na requisição:", error);
                statusDiv.innerText = "❌ Ocorreu um erro ao processar a imagem.";
            }
        }

        function extrairApostas(texto, liga) {
            const resultadoDiv = document.getElementById('resultado');
            const linhas = texto.split('\n');
            const regexTravessao = /\b([0-9A-Za-z]+)\s*[-–—]\s*([0-9A-Za-z.,]+)\b/g;

            let apostas = [];

            linhas.forEach((linha) => {
                let match;
                while ((match = regexTravessao.exec(linha)) !== null) {
                    apostas.push(`${match[1].trim()} - ${match[2].trim()}`);
                }
            });

            if (apostas.length > 0) {
                resultadoDiv.innerText = `[LIGA: ${liga.toUpperCase()}]\n\n` + apostas.join('\n');
            } else {
                resultadoDiv.innerText = `[LIGA: ${liga.toUpperCase()}]\n\nNenhuma aposta no formato "Aposta - Prognóstico" foi encontrada.`;
            }
        }

        function convertToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => {
                    const base64Clean = reader.result.split(',')[1];
                    resolve(base64Clean);
                };
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
