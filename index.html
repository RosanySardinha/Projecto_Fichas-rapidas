<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner OCR - Elephant Bet</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            color: #38bdf8;
            margin-bottom: 20px;
        }

        .upload-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
        }

        .btn:hover {
            background-color: #1d4ed8;
        }

        .btn-camera {
            background-color: #16a34a;
        }

        .btn-camera:hover {
            background-color: #15803d;
        }

        #preview-container {
            width: 100%;
            margin-top: 15px;
            display: none;
            text-align: center;
        }

        #preview-img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 8px;
            border: 2px solid #334155;
        }

        .status {
            text-align: center;
            margin: 15px 0;
            font-size: 0.95rem;
            font-weight: 600;
            min-height: 24px;
            color: #fbbf24;
        }

        .results-box {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
        }

        .results-box h2 {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 10px;
            border-bottom: 1px solid #334155;
            padding-bottom: 5px;
        }

        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: monospace;
            font-size: 0.9rem;
            color: #e2e8f0;
            max-height: 200px;
            overflow-y: auto;
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Elephant Bet - OCR Scanner</h1>

        <div class="upload-section">
            <!-- Botão para acionar a câmara do telemóvel -->
            <button class="btn btn-camera" onclick="document.getElementById('cameraInput').click()">
                📷 Tirar Foto da Ficha
            </button>
            <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="handleFileSelect(event)">

            <!-- Botão para escolher da Galeria -->
            <button class="btn" onclick="document.getElementById('galleryInput').click()">
                📁 Escolher da Galeria
            </button>
            <input type="file" id="galleryInput" accept="image/*" onchange="handleFileSelect(event)">
        </div>

        <!-- Pré-visualização da imagem -->
        <div id="preview-container">
            <img id="preview-img" src="" alt="Ficha de Aposta">
        </div>

        <!-- Mensagens de estado -->
        <div id="status" class="status"></div>

        <!-- Resultado do OCR -->
        <div class="results-box">
            <h2>Texto Extraído:</h2>
            <pre id="output">Aguardando envio da imagem da ficha...</pre>
        </div>
    </div>

    <script>
        // 🔑 A tua chave da Google Cloud Vision API
        const GOOGLE_VISION_API_KEY = 'AIzaSyBDS05EdjeiG4ht4Y5GO9NHUpZR16mrvWc';

        // Processa o ficheiro selecionado ou capturado
        async function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const previewImg = document.getElementById('preview-img');
            const previewContainer = document.getElementById('preview-container');
            const statusDiv = document.getElementById('status');
            const outputPre = document.getElementById('output');

            // Mostrar a imagem selecionada no ecrã
            previewImg.src = URL.createObjectURL(file);
            previewContainer.style.display = 'block';

            statusDiv.style.color = '#fbbf24';
            statusDiv.innerText = "⏳ A ler ficha com Google Cloud Vision...";
            outputPre.innerText = "A processar dados...";

            try {
                // 1. Converte a imagem para Base64
                const base64Clean = await convertToBase64(file);

                // 2. Faz o envio do pedido POST para a API do Google Cloud
                const response = await fetch(`https://vision.googleapis.com/v1/images:annotate?key=${GOOGLE_VISION_API_KEY}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        requests: [{
                            image: { content: base64Clean },
                            features: [{ type: 'TEXT_DETECTION' }]
                        }]
                    })
                });

                const data = await response.json();

                // 3. Processa a resposta
                if (data.responses && data.responses[0].fullTextAnnotation) {
                    const textoExtraido = data.responses[0].fullTextAnnotation.text;
                    statusDiv.style.color = '#4ade80';
                    statusDiv.innerText = "✅ Leitura concluída com sucesso!";
                    outputPre.innerText = textoExtraido;

                    // Aqui podes adicionar a tua lógica de parsing para extrair odds, equipas e códigos da Elephant Bet!
                } else if (data.responses && data.responses[0].error) {
                    statusDiv.style.color = '#f87171';
                    statusDiv.innerText = "❌ Erro na API: " + data.responses[0].error.message;
                    outputPre.innerText = JSON.stringify(data.responses[0].error, null, 2);
                } else {
                    statusDiv.style.color = '#f87171';
                    statusDiv.innerText = "⚠️ Nenhum texto legível foi encontrado.";
                    outputPre.innerText = "Tenta tirar uma foto com melhor iluminação ou mais focada.";
                }

            } catch (error) {
                console.error("Erro na comunicação com a API:", error);
                statusDiv.style.color = '#f87171';
                statusDiv.innerText = "❌ Ocorreu um erro ao enviar a imagem.";
                outputPre.innerText = error.message;
            }
        }

        // Função para converter o ficheiro de imagem numa string Base64 limpa
        function convertToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => {
                    // Remove o prefixo 'data:image/...;base64,'
                    const base64 = reader.result.split(',')[1];
                    resolve(base64);
                };
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
