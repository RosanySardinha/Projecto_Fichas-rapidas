<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zona Fichas Rápidas</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: #1e293b;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid #334155;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.6rem;
            color: #38bdf8;
            font-weight: 700;
        }

        .header p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #38bdf8;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        select {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid #2563eb;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 0.95rem;
            outline: none;
        }

        select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }

        .upload-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            color: white;
            text-align: center;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-camera {
            background-color: #16a34a;
        }

        .btn-gallery {
            background-color: #2563eb;
        }

        #preview-container {
            display: none;
            margin-bottom: 18px;
            text-align: center;
        }

        #preview-img {
            max-width: 100%;
            max-height: 220px;
            border-radius: 8px;
            border: 2px solid #2563eb;
            object-fit: contain;
        }

        .status {
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 16px;
            min-height: 20px;
            color: #fbbf24;
        }

        .output-box {
            background-color: #0f172a;
            border: 1px solid #2563eb;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 14px;
        }

        .output-box h2 {
            font-size: 0.85rem;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 8px;
            text-transform: uppercase;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 4px;
        }

        pre {
            white-space: pre-wrap;
            word-break: break-word;
            font-family: monospace;
            font-size: 0.9rem;
            color: #e2e8f0;
            max-height: 180px;
            overflow-y: auto;
        }

        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Cabeçalho -->
        <div class="header">
            <h1>Zona Fichas Rápidas</h1>
            <p>Digitalizador e leitor automático de fichas manuais</p>
        </div>

        <!-- Seletor de Liga -->
        <div class="form-group">
            <label for="leagueSelect">Selecionar Liga / Competição</label>
            <select id="leagueSelect">
                <option value="geral">Geral / Todas as Ligas</option>
                <option value="angola">Girabola (Angola)</option>
                <option value="premier">Premier League (Inglaterra)</option>
                <option value="laliga">La Liga (Espanha)</option>
                <option value="seriea">Serie A (Itália)</option>
                <option value="ligaportugal">Liga Portugal</option>
                <option value="champions">UEFA Champions League</option>
            </select>
        </div>

        <!-- Botões -->
        <div class="upload-buttons">
            <button class="btn btn-camera" onclick="document.getElementById('camInput').click()">
                📷 Tirar Foto
            </button>
            <button class="btn btn-gallery" onclick="document.getElementById('galInput').click()">
                📁 Galeria
            </button>
        </div>

        <input type="file" id="camInput" accept="image/*" capture="environment" onchange="processarFicha(event)">
        <input type="file" id="galInput" accept="image/*" onchange="processarFicha(event)">

        <!-- Preview da Foto -->
        <div id="preview-container">
            <img id="preview-img" src="" alt="Ficha de Aposta">
        </div>

        <!-- Mensagem de Estado -->
        <div id="status" class="status"></div>

        <!-- Resultados Filtrados (Aposta - Prognóstico) -->
        <div class="output-box">
            <h2>🎯 Apostas Filtradas (Aposta - Prognóstico)</h2>
            <pre id="parsedOutput">Aguardando envio da ficha...</pre>
        </div>

        <!-- Texto Bruto do OCR -->
        <div class="output-box">
            <h2>📄 Texto Bruto Extraído (OCR)</h2>
            <pre id="rawOutput">Aguardando envio da ficha...</pre>
        </div>
    </div>

    <script>
        // 🔑 Tua Chave de API Google Cloud Vision
        const GOOGLE_VISION_API_KEY = 'AIzaSyBDS05EdjeiG4ht4Y5GO9NHUpZR16mrvWc';

        async function processarFicha(event) {
            const file = event.target.files[0];
            if (!file) return;

            const previewImg = document.getElementById('preview-img');
            const previewContainer = document.getElementById('preview-container');
            const statusDiv = document.getElementById('status');
            const parsedPre = document.getElementById('parsedOutput');
            const rawPre = document.getElementById('rawOutput');
            const liga = document.getElementById('leagueSelect').value;

            // Exibe a foto
            previewImg.src = URL.createObjectURL(file);
            previewContainer.style.display = 'block';

            statusDiv.style.color = '#fbbf24';
            statusDiv.innerText = "⏳ A ler ficha manual com Google Vision...";
            parsedPre.innerText = "A filtrar jogos...";
            rawPre.innerText = "A ligar ao servidor...";

            try {
                const base64Clean = await convertToBase64(file);

                const response = await fetch(`https://vision.googleapis.com/v1/images:annotate?key=${GOOGLE_VISION_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        requests: [{
                            image: { content: base64Clean },
                            features: [{ type: 'TEXT_DETECTION' }]
                        }]
                    })
                });

                const data = await response.json();

                if (data.responses && data.responses[0].fullTextAnnotation) {
                    const textoExtraido = data.responses[0].fullTextAnnotation.text;
                    statusDiv.style.color = '#4ade80';
                    statusDiv.innerText = "✅ Leitura concluída com sucesso!";
                    rawPre.innerText = textoExtraido;

                    // Filtra o padrão Aposta - Prognóstico
                    extrairApostasManual(textoExtraido, liga);
                } else if (data.responses && data.responses[0].error) {
                    statusDiv.style.color = '#f87171';
                    statusDiv.innerText = "❌ Erro na API: " + data.responses[0].error.message;
                } else {
                    statusDiv.style.color = '#f87171';
                    statusDiv.innerText = "⚠️ Nenhum texto legível encontrado na imagem.";
                }

            } catch (error) {
                console.error("Erro no processamento:", error);
                statusDiv.style.color = '#f87171';
                statusDiv.innerText = "❌ Erro ao enviar a imagem.";
            }
        }

        function extrairApostasManual(texto, liga) {
            const parsedPre = document.getElementById('parsedOutput');
            const linhas = texto.split('\n');
            const regexTravessao = /\b([0-9A-Za-z]+)\s*[-–—]\s*([0-9A-Za-z.,]+)\b/g;

            let apostasEncontradas = [];

            linhas.forEach((linha) => {
                let match;
                while ((match = regexTravessao.exec(linha)) !== null) {
                    apostasEncontradas.push(`${match[1].trim()} - ${match[2].trim()}`);
                }
            });

            if (apostasEncontradas.length > 0) {
                let resultado = `[LIGA: ${liga.toUpperCase()}]\n[TOTAL: ${apostasEncontradas.length} JOGOS]\n\n`;
                resultado += apostasEncontradas.join('\n');
                parsedPre.innerText = resultado;
            } else {
                parsedPre.innerText = `[LIGA: ${liga.toUpperCase()}]\n\n⚠️ Nenhuma linha no formato "Aposta - Prognóstico" foi reconhecida.`;
            }
        }

        function convertToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
