<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zona Fichas Rápidas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #218838;
        }
        #resultado {
            margin-top: 15px;
            text-align: left;
            background: #e9ecef;
            padding: 10px;
            border-radius: 4px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Zona Fichas Rápidas</h2>
        <p>Tira uma foto ou escolhe a imagem da ficha:</p>
        
        <input type="file" id="fotoFicha" accept="image/*" capture="environment">
        <button id="btnLer">Ler Ficha com IA</button>

        <div id="resultado">Aguardando imagem...</div>
    </div>

    <!-- Script externo carregado com segurança -->
    <script src="script.js"></script>
</body>
</html>
