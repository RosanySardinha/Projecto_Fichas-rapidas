<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zona Fichas Rápidas</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bl:#1a62c0;--bl2:#2b86d9;--bg:#eef1f6;--card:#fff;--tx:#1a2b6b;--mu:#6f7b92;--pk:#e8208a;--ok:#1a8f4e;--wa:#b87500;--er:#d03030;--bd:#e0e5ee}
@media(prefers-color-scheme:dark){:root{--bg:#0f1624;--card:#18223a;--tx:#dbe5ff;--mu:#93a1c0;--bd:#2a3654}}
*{box-sizing:border-box}body{margin:0;background:#0e1a33;font-family:Nunito,system-ui,sans-serif;color:var(--tx)}
:focus-visible{outline:3px solid #ffb84d;outline-offset:2px}
#app{max-width:560px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
header{background:var(--bl);color:#fff;display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 18px 14px}
header h1{flex:1;margin:0;font-size:21px;font-weight:800}header button{background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
.sp{background:var(--bl2);display:flex;justify-content:space-around;padding:10px 0}.sp span{font-size:30px;opacity:.55}.sp .a{opacity:1}
#main{flex:1;overflow:auto;padding:0 14px 120px}
h3{text-align:center;font-weight:600;font-size:18px;margin:24px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px}
.lr{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--bd);cursor:pointer}.lr:last-child{border:0}.lr div{flex:1}
.lr b{display:block;font-size:19px;font-weight:700}.lr small{color:var(--mu);font-style:italic;font-size:15px}
.fl{font-size:28px}.cn{border:1px solid var(--bd);padding:8px 12px;border-radius:4px;color:var(--mu);font-size:14px}.cn b{display:inline;font-size:24px;color:var(--mu)}
.sr{width:100%;font:inherit;padding:11px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx);margin-top:14px}
.bk{color:var(--bl2);font-weight:700;padding:14px 0 0;cursor:pointer}.em,.hw{color:var(--mu);text-align:center;padding:0 10px}.hw{text-align:left;padding:14px;line-height:1.5;font-size:15px;color:var(--tx)}
.gm{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:12px;margin-bottom:10px}
.gh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:10px}.gh b{font-size:17px}
.cd{background:var(--bl);color:#fff;border-radius:4px;padding:2px 9px;font-weight:800;font-size:15px}
.g3,.g4{display:grid;gap:8px}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr);margin-top:8px}
.od{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:5px;padding:7px 2px;font:inherit;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.od i{font-style:normal;font-weight:600;font-size:12px;color:var(--mu)}.od.on{background:var(--bl2);color:#fff;border-color:var(--bl2)}.od.on i{color:#e3f0ff}
.mr{background:none;border:0;color:var(--bl2);font:inherit;font-size:14px;margin-top:6px;cursor:pointer;padding:4px 0}
.ln{display:grid;grid-template-columns:auto 1fr auto;gap:8px;padding:10px;border-bottom:1px solid var(--bd);align-items:center}.lg{grid-column:1/-1;color:var(--mu);font-size:14px}
.bd{border:0;border-radius:4px;padding:6px 8px;font:inherit;font-size:13px;font-weight:700;color:#fff;min-width:70px}.bd.ok{background:var(--ok)}.bd.wa{background:var(--wa)}.bd.er{background:var(--er)}
.ed,#mtxt,#stk,.k{width:100%;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:5px;background:var(--card);color:var(--tx)}
.x{background:none;border:0;font-size:24px;color:var(--mu);cursor:pointer}.sm{padding:14px;margin-top:12px}#nums div{display:flex;justify-content:space-between;padding:7px 0;font-size:17px}
.cf{background:var(--pk);color:#fff;border:0;border-radius:6px;padding:14px;width:100%;font:inherit;font-weight:800;font-size:17px;cursor:pointer;margin-top:10px}.cf:disabled{opacity:.4;cursor:not-allowed}
nav{position:absolute;bottom:0;left:0;right:0;background:var(--bl);display:flex;align-items:center;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:#cfe3ff;font:inherit;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative}
nav button.a{color:#fff;font-weight:700}nav .ic{font-size:22px} nav .fab{flex:0 0 84px;height:84px;margin-top:-52px;border-radius:50%;background:var(--pk);box-shadow:0 4px 12px #0006;color:#fff;font-size:34px;justify-content:center}
#nb{position:absolute;top:-4px;right:26%;background:var(--pk);color:#fff;border-radius:9px;font-size:12px;padding:0 6px;font-weight:800}
.ov{position:absolute;inset:0;background:#0009;display:flex;align-items:flex-end;z-index:5}
.sh{background:var(--card);width:100%;max-height:92%;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sth{display:flex;justify-content:space-between;align-items:center;font-size:20px}.hint{color:var(--mu);font-size:14px;line-height:1.45}
.ph{display:flex;gap:8px;overflow-x:auto;margin:10px 0}.th{position:relative;flex:0 0 84px}.th img{width:84px;height:84px;object-fit:cover;border-radius:6px}
.th button{position:absolute;top:2px;right:2px;border:0;border-radius:50%;width:22px;height:22px;background:#000a;color:#fff}.th span{position:absolute;bottom:3px;left:5px;color:#fff;font-weight:800;text-shadow:0 0 3px #000}
.bt{display:flex;gap:8px;margin:10px 0}.b1,.b2{flex:1;text-align:center;padding:12px;border-radius:6px;font:inherit;font-weight:700;cursor:pointer;border:0}
.b1{background:var(--bl2);color:#fff}.b2{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}.w{width:100%;margin-top:8px}
.erm{color:var(--er);font-weight:600}hr{border:0;border-top:1px solid var(--bd);margin:16px 0}
.tk div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:15px}.tk .t{font-weight:800;font-size:18px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px}.chip{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:18px;padding:7px 13px;font:inherit;font-weight:700;cursor:pointer}.chip.on{background:var(--bl2);color:#fff;border-color:var(--bl2)}
.tm{color:var(--mu);font-size:13px;margin:-4px 0 10px}.stp{background:var(--bg);border-left:4px solid var(--ok);border-radius:4px;padding:10px 12px;font-size:14px;line-height:1.45;margin:6px 0}.gl{display:block;text-align:center;color:var(--bl2);font-weight:700;padding:12px;cursor:pointer}
.fg{width:38px;height:25px;border-radius:3px;border:1px solid var(--bd);flex:none;vertical-align:middle}.chip .fg{width:21px;height:14px;margin-right:7px}h3 .fg{width:28px;height:19px;margin-right:6px;vertical-align:-3px}
</style></head><body>
<div id="app">
<header><span style="font-size:24px">🎟️</span><h1>Zona Fichas Rápidas</h1><button data-a="sr" aria-label="Procurar">🔍</button></header>
<div class="sp"><span class="a">⚽</span><span>🏀</span><span>🎾</span><span>🥊</span></div>
<div id="main"></div>
<nav>
<button data-a="home"><span class="ic">🏠</span>Início</button>
<button data-a="ficha"><span class="ic">🎫</span>Ficha<b id="nb" hidden></b></button>
<button class="fab" data-a="scan" aria-label="Ler ficha com a câmara">📷</button>
<button data-a="clr"><span class="ic">🗑️</span>Limpar</button>
<button data-a="cfg"><span class="ic">⚙️</span>Definições</button>
</nav>
<div id="modal"></div>
</div>
<script>
const $=s=>document.querySelector(s),e=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v)}catch(x){return''}};
const M=['1','X','2','1X','12','X2','+2.5','-2.5','GG','NG'];
const L=[
{id:'pl',n:'Premier League',s:'Futebol - Inglaterra',f:'🇬🇧',b:1000,g:'Arsenal|Chelsea,Liverpool|Man. City,Man. United|Tottenham,Newcastle|Aston Villa,Brighton|West Ham,Everton|Fulham,Brentford|Crystal Palace,Wolves|Bournemouth,Nottm Forest|Leeds,Sunderland|Burnley,Chelsea|Liverpool,Man. City|Arsenal,Tottenham|Newcastle,Aston Villa|Man. United,West Ham|Everton'},
{id:'ll',n:'LaLiga',s:'Futebol - Espanha',f:'🇪🇸',b:2000,g:'Real Madrid|Barcelona,Atlético Madrid|Sevilha,Valência|Villarreal,Real Sociedad|Athletic Bilbau,Betis|Girona,Celta Vigo|Osasuna,Getafe|Mallorca,Rayo Vallecano|Alavés,Espanyol|Levante,Elche|Oviedo,Barcelona|Atlético Madrid,Sevilha|Real Madrid,Villarreal|Betis,Athletic Bilbau|Valência,Girona|Real Sociedad'},
{id:'sa',n:'Liga Italiana (Serie A)',s:'Futebol - Itália',f:'🇮🇹',b:3000,g:'Inter|Milan,Juventus|Napoli,Roma|Lazio,Atalanta|Fiorentina,Bolonha|Torino,Udinese|Génova,Sassuolo|Cagliari,Parma|Como,Lecce|Verona,Cremonese|Pisa,Milan|Juventus,Napoli|Inter,Lazio|Atalanta,Fiorentina|Roma,Torino|Udinese'},
{id:'uc',n:'Liga dos Campeões UEFA',s:'Futebol - Clubes Internacionais',f:'🌍',b:4000,g:'Real Madrid|Man. City,Bayern|PSG,Barcelona|Inter,Liverpool|Atlético Madrid,Arsenal|Dortmund,Benfica|Juventus,Sporting|Chelsea,Napoli|Ajax,Porto|Milan,Leverkusen|Newcastle,Galatasaray|Tottenham,Celtic|Atalanta,Marselha|Club Brugge,PSV|Villarreal,Salzburgo|Copenhaga'},
{id:'gi',n:'Girabola',s:'Futebol - Angola',f:'🇦🇴',b:5000,g:'Petro de Luanda|1.º de Agosto,Sagrada Esperança|Interclube,Kabuscorp|Académica do Lobito,Recreativo do Libolo|Bravos do Maquis,Desportivo da Huíla|Wiliete,Académica do Soyo|Cuando Cubango,Santa Rita de Cássia|Mavinga,Domant|Sporting de Cabinda,FC Bravos|Petro de Luanda,1.º de Agosto|Interclube,Kabuscorp|Sagrada Esperança,Libolo|Huíla,Wiliete|Soyo,Interclube|Libolo,Petro de Luanda|Kabuscorp'}
];
const G={};
const FG={pl:'<rect width="30" height="20" fill="#fff"/><rect x="13" width="4" height="20" fill="#ce1124"/><rect y="8" width="30" height="4" fill="#ce1124"/>',ll:'<rect width="30" height="20" fill="#aa151b"/><rect y="5" width="30" height="10" fill="#f1bf00"/>',sa:'<rect width="10" height="20" fill="#009246"/><rect x="10" width="10" height="20" fill="#fff"/><rect x="20" width="10" height="20" fill="#ce2b37"/>',uc:'<rect width="30" height="20" fill="#039"/>'+Array.from({length:12},(_,k)=>`<circle cx="${(15+6*Math.sin(k*Math.PI/6)).toFixed(1)}" cy="${(10-6*Math.cos(k*Math.PI/6)).toFixed(1)}" r="1" fill="#fc0"/>`).join(''),gi:'<rect width="30" height="10" fill="#cc092f"/><rect y="10" width="30" height="10" fill="#000"/><circle cx="15" cy="10" r="4" fill="none" stroke="#ffcb00" stroke-width="1.2"/><path d="M15 7.6l.7 1.9h2l-1.6 1.2.6 1.9-1.7-1.2-1.7 1.2.6-1.9-1.6-1.2h2z" fill="#ffcb00"/>'};
const fg=id=>`<svg class="fg" viewBox="0 0 30 20" role="img" aria-hidden="true">${FG[id]}</svg>`;
L.forEach((l,li)=>{l.j=l.g.split(',').map((t,i)=>{const[h,a]=t.split('|');let s=(li+1)*97+i*31;const r=()=>(s=(s*9301+49297)%233280)/233280;let p1=.26+r()*.4+(l.id=='gi'?.1:0),px=.2+r()*.1,p2=Math.max(.1,1-p1-px);const T=p1+px+p2;p1/=T;px/=T;p2/=T;const po=.38+r()*.32,pg=.4+r()*.28,o=x=>Math.max(1.05,Math.round(.92/x*100)/100);const c=String(l.b+i+1);const d=new Date();d.setDate(d.getDate()+1+i%6);const hh=[13.5,16,18.5,20.75,21][(i+li)%5];d.setHours(Math.floor(hh),(hh%1)*60);return G[c]={c,h,a,l:l.n,t:d.toLocaleDateString('pt-PT',{weekday:'short',day:'2-digit',month:'2-digit'})+' · '+d.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'}),od:{'1':o(p1),X:o(px),'2':o(p2),'1X':o(p1+px),'12':o(p1+p2),X2:o(px+p2),'+2.5':o(po),'-2.5':o(1-po),GG:o(pg),NG:o(1-pg)}}})});
const np=p=>{p=String(p||'').toUpperCase().replace(/\s|\u2212/g,'').replace(/,/g,'.');if(/^(\+|MAIS|O)2\.5$/.test(p))return'+2.5';if(/^(-|MENOS|U)2\.5$/.test(p))return'-2.5';return({X1:'1X','2X':'X2',21:'12'})[p]||p};
const fx=n=>(+n).toFixed(2),kz=n=>Math.round(n).toLocaleString('pt-PT')+' Kz';
let F=[],V='home',Q='',open=new Set(),modal=null,S={ph:[],txt:'',busy:'',err:''},stake=1000,T=null;
const st=(x,i)=>{if(!G[x.c])return['er','Código inválido'];if(!M.includes(np(x.p)))return['er','Prognóstico inválido'];if(F.some((y,j)=>j<i&&y.c==x.c))return['er','Jogo repetido'];if(x.conf<.85)return['wa','Rever'];return['ok','OK']};
const info=()=>{let o=1;F.forEach(x=>{const g=G[x.c],p=np(x.p);if(g&&g.od[p])o*=g.od[p]});return{o,gain:stake*o}};
const parse=t=>t.split(';').map(s=>s.trim()).filter(Boolean).map(s=>{const i=s.indexOf('.');return i<0?{c:s.replace(/\D/g,''),p:'',conf:1}:{c:s.slice(0,i).replace(/\D/g,''),p:s.slice(i+1),conf:1}});
function gameH(g){const sel=p=>F.some(x=>x.c==g.c&&np(x.p)==p),o=open.has(g.c);const b=p=>`<button class="od${sel(p)?' on':''}" data-a="pick" data-c="${g.c}" data-p="${p}"><i>${p}</i>${fx(g.od[p])}</button>`;return`<div class="gm"><div class="gh"><b>${g.h} – ${g.a}</b><span class="cd">${g.c}</span></div><div class="tm">${g.t} · ${g.l}</div><div class="g3">${['1','X','2'].map(b).join('')}</div>${o?`<div class="g4">${M.slice(3).map(b).join('')}</div>`:''}<button class="mr" data-a="more" data-c="${g.c}">${o?'Menos mercados':'Mais 7 mercados'}</button></div>`}
function res(){const q=Q.trim().toLowerCase();if(!q)return`<h3>Melhores Competições</h3><div class="card">${L.map(l=>`<div class="lr" data-a="lg" data-id="${l.id}" tabindex="0">${fg(l.id)}<div><b>${l.n}</b><small>${l.s}</small></div><span class="cn"><b>${l.j.length}</b> jogos</span></div>`).join('')}</div> <h3>Melhores Apostas</h3>${['4001','4002','2001','1001'].map(c=>gameH(G[c])).join('')}<h3>Como escrever a ficha</h3><div class="card hw">Cada selecção é <b>código.prognóstico</b> e as selecções da combinação separam-se com <b>ponto e vírgula</b>.<br>Exemplo: <b>1001.1;2004.X;4007.+2.5</b><br>Prognósticos: 1, X, 2, 1X, 12, X2, +2.5, -2.5, GG, NG.<br>Códigos: Premier League 1001–1015, LaLiga 2001–2015, Serie A 3001–3015, Champions 4001–4015, Girabola 5001–5015.<br><small style="color:var(--mu)">Demonstração: jogos e odds fictícios.</small></div>`;const l=Object.values(G).filter(g=>g.c.startsWith(q)||(g.h+' '+g.a).toLowerCase().includes(q)).slice(0,30);return l.length?l.map(gameH).join(''):'<p class="em">Nenhum jogo encontrado.</p>'}
const home=()=>`<input id="q" class="sr" placeholder="Procurar por código ou equipa" value="${e(Q)}" aria-label="Procurar"><div id="res">${res()}</div>`;
const leagueV=()=>{const l=L.find(x=>x.id==V);return`<div class="chips">${L.map(x=>`<button class="chip${x.id==V?' on':''}" data-a="lg" data-id="${x.id}">${fg(x.id)}${x.n.replace(' (Serie A)','')}</button>`).join('')}</div><div class="bk" data-a="home" tabindex="0">← Competições</div><h3 style="margin:10px 0 2px">${fg(l.id)} ${l.n}</h3><p class="em" style="margin:0 0 14px">${l.s} · ${l.j.length} jogos</p>`+l.j.map(gameH).join('')};
function fichaV(){const rows=F.map((x,i)=>{const[c,t]=st(x,i),g=G[x.c],p=np(x.p);return`<div class="ln"><button class="bd ${c}" ${c=='wa'?`data-a="okl" data-i="${i}" title="Toca para confirmar a leitura"`:'tabindex="-1"'}>${t}</button><input class="ed" data-a="edit" data-i="${i}" value="${e(x.c+'.'+x.p)}" aria-label="Selecção ${i+1}"><button class="x" data-a="del" data-i="${i}" aria-label="Remover">×</button><div class="lg">${g?`${g.h} – ${g.a}${g.od[p]?' · '+fx(g.od[p]):''}`:'Sem jogo com este código'} ${x.src?`<small>(${x.src})</small>`:''}</div></div>`}).join('');return`<h3>A tua ficha</h3>`+(F.length?`<div class="card">${rows}</div>`:`<p class="em">Ainda sem selecções. Toca na câmara ou escolhe odds nos jogos.</p>`)+`<button class="b1 w" data-a="scan">📷 Adicionar foto a esta ficha</button><div class="card sm"><label>Valor da aposta (Kz)<input id="stk" type="number" min="0" value="${stake}"></label><div id="nums"></div><button class="cf" id="cf" data-a="conf">Confirmar ficha</button></div>`}
function nums(){const n=$('#nums');if(!n)return;const{o,gain}=info();n.innerHTML=`<div><span>Odds totais</span><b>${fx(o)}</b></div><div><span>Ganho possível</span><b>${kz(gain)}</b></div>`;$('#cf').disabled=!(F.length&&stake>0&&F.every((x,i)=>st(x,i)[0]=='ok'))}
function modalH(){
if(modal=='scan'){const n=S.ph.length;return`<div class="ov"><div class="sh"><div class="sth"><b>Ler ficha</b><button class="x" data-a="close" aria-label="Fechar">×</button></div> ${n?'':'<p class="hint">Tira uma foto da ficha escrita à mão. Se a combinação ocupa várias folhas, poderás adicionar mais fotos a seguir.</p>'} <div class="ph">${S.ph.map((u,i)=>`<div class="th"><img src="${u}" alt="Foto ${i+1}"><button data-a="rm" data-i="${i}" aria-label="Remover foto">×</button><span>${i+1}</span></div>`).join('')}</div> ${n?`<div class="stp"><b>${n==1?'1 foto adicionada':n+' fotos adicionadas'}</b><br>A ficha tem mais selecções noutra folha? Adiciona outra foto: todas são lidas como uma única ficha.</div>`:''} <div class="bt"><label class="b1">${n?'➕ Adicionar mais uma foto':'📷 Tirar foto da ficha'}<input id="cam" type="file" accept="image/*" capture="environment" hidden></label></div> <button class="cf" data-a="read" ${n&&!S.busy?'':'disabled'}>${S.busy||(n?'✅ Ler ficha ('+n+(n==1?' foto)':' fotos)'):'Ler ficha')}</button> <label class="gl">ou escolher da galeria<input id="gal" type="file" accept="image/*" multiple hidden></label>${S.err?`<p class="erm">${e(S.err)}</p>`:''} <hr><b>Ou escreve a ficha</b><input id="mtxt" class="k" style="margin-top:8px" placeholder="1001.1;2004.X;4007.+2.5" value="${e(S.txt)}"><button class="b2 w" data-a="addtxt">Adicionar à ficha</button></div></div>`}
if(modal=='cfg')return`<div class="ov"><div class="sh"><div class="sth"><b>Definições</b><button class="x" data-a="close" aria-label="Fechar">×</button></div><p class="hint">A leitura da foto passa por um servidor seguro. A chave Groq fica guardada apenas no servidor, nunca nesta app nem no GitHub.</p><button class="cf" data-a="close">Fechar</button></div></div>`;
if(modal=='tk')return`<div class="ov"><div class="sh tk"><div class="sth"><b>Ficha ${T.no}</b></div><p class="hint">${T.when} · Demonstração: nenhuma aposta real foi feita.</p> ${T.L.map(x=>{const g=G[x.c],p=np(x.p);return`<div><span>${x.c}.${p} ${g.h} – ${g.a}</span><b>${fx(g.od[p])}</b></div>`}).join('')}<hr><div><span>Valor</span><b>${kz(T.stake)}</b></div><div><span>Odds totais</span><b>${fx(T.o)}</b></div><div class="t"><span>Ganho possível</span><b>${kz(T.gain)}</b></div> <button class="cf" data-a="new">Nova ficha</button></div></div>`;
return''}
function render(){const m=$('#main');m.innerHTML=V=='home'?home():V=='ficha'?fichaV():leagueV();$('#nb').textContent=F.length;$('#nb').hidden=!F.length;document.querySelectorAll('nav [data-a=home],nav [data-a=ficha]').forEach(b=>b.classList.toggle('a',b.dataset.a==(V=='ficha'?'ficha':'home')));if(V=='ficha')nums();$('#modal').innerHTML=modalH()}
const rs=f=>new Promise(r=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const k=Math.min(1,1024/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.75))};i.src=u});
async function lerFoto(url){
  const r=await fetch('/api/ler-ficha',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({imageUrl:url})});
  if(!r.ok) throw Error('Erro ao ler a ficha. Tenta de novo.');
  const data=await r.json();
  const t=data.choices[0].message.content;
  try{return JSON.parse(t)}catch(x){return JSON.parse(t.match(/\{[\s\S]*\}/)[0])}
}
async function ler(){S.err='';try{for(let i=0;i<S.ph.length;i++){S.busy=`A ler foto ${i+1} de ${S.ph.length}…`;$('#modal').innerHTML=modalH();const d=await lerFoto(S.ph[i]);(d.linhas||[]).forEach(l=>F.push({c:String(l.c||'').replace(/\D/g,''),p:String(l.p??''),conf:+l.conf||.5,src:'Foto '+(i+1)}));const v=parseInt(String(d.valor||'').replace(/\D/g,''));if(v)stake=v}S.ph=[];S.busy='';modal=null;V='ficha'}catch(x){S.busy='';S.err=x.message=='Failed to fetch'?'Sem ligação ao servidor. Verifica a internet.':x.message}render()}
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-a]');if(!t||t.tagName=='INPUT')return;const a=t.dataset.a,i=+t.dataset.i;if(a=='home'){V='home'}else if(a=='ficha')V='ficha';else if(a=='lg')V=t.dataset.id;else if(a=='sr'){V='home';render();$('#q').focus();return}else if(a=='pick'){const c=t.dataset.c,p=t.dataset.p,k=F.findIndex(x=>x.c==c);if(k>=0&&np(F[k].p)==p)F.splice(k,1);else if(k>=0)F[k]={c,p,conf:1,src:'Jogos'};else F.push({c,p,conf:1,src:'Jogos'})}else if(a=='more'){open.has(t.dataset.c)?open.delete(t.dataset.c):open.add(t.dataset.c)}else if(a=='del')F.splice(i,1);else if(a=='okl')F[i].conf=1;else if(a=='clr'){F=[]}else if(a=='scan'){modal='scan';S.err=''}else if(a=='cfg')modal='cfg';else if(a=='close')modal=null;else if(a=='rm')S.ph.splice(i,1);else if(a=='read'){ler();return}else if(a=='addtxt'){const l=parse(S.txt);if(!l.length){S.err='Escreve pelo menos uma selecção, por exemplo 1001.1';render();return}l.forEach(x=>F.push({...x,src:'Texto'}));S.txt='';S.err='';modal=null;V='ficha'}else if(a=='savecfg'){modal=null}else if(a=='conf'){const o=info();T={no:'ZFR-'+Math.random().toString(36).slice(2,10).toUpperCase(),L:F.map(x=>({...x})),stake,...o,when:new Date().toLocaleString('pt-PT')};modal='tk'}else if(a=='new'){F=[];modal=null;T=null;V='home'}else return;const sy=a=='lg'||a=='home'?0:$('#main').scrollTop;render();$('#main').scrollTop=sy});
document.addEventListener('keydown',ev=>{if(ev.key=='Enter'&&ev.target.dataset.a=='lg')ev.target.click()});
document.addEventListener('change',async ev=>{const t=ev.target;if(t.dataset.a=='edit'){const v=t.value,k=v.indexOf('.'),i=+t.dataset.i;F[i]={...F[i],c:(k<0?v:v.slice(0,k)).replace(/\D/g,''),p:k<0?'':v.slice(k+1),conf:1};render()}if(t.id=='cam'||t.id=='gal'){for(const f of t.files)S.ph.push(await rs(f));t.value='';S.err='';$('#modal').innerHTML=modalH()}});
document.addEventListener('input',ev=>{const t=ev.target;if(t.id=='q'){Q=t.value;$('#res').innerHTML=res()}else if(t.id=='stk'){stake=+t.value||0;nums()}else if(t.id=='mtxt')S.txt=t.value});
render();
